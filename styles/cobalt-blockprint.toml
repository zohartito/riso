# cobalt-blockprint — prompt-driven, original subject matter over a local,
# object-free reference. The reference was generated by riso.motif; no artist
# image is uploaded to ComfyUI or consumed by this preset.

name = "cobalt-blockprint"
description = "Prompt-authored subjects as cobalt and warm-sand block prints."

[generate]
ref = "refs/style-cobalt-blockprint-abstract.png"
strength = 0.08
steps = 4

# Redux fills unoccupied space with the reference. Keep enough of the frame to
# preserve authored composition while trimming the broadest reference bleed.
# Live dense/sparse validation is recorded in docs/cobalt-blockprint-prompts.md.
crop_keep = 0.78

# Content stays entirely in the user's prompt. This suffix describes medium
# and image mechanics only: no artist names, places, people, pyramids, water,
# rays, or other borrowed subject/composition cues.
prompt_suffix = ", flat two-ink block print made from matte cut-paper shapes, solid colour fields, forms defined only by colour adjacency, no outlines, no linework, no gradients, no shading, no text"

[post]
palette = "egypt-cobalt"
palette_mode = "luma"

[post.misregister]
px = 1

[post.grain]
amount = 0.08
# seed omitted: the run seed controls grain reproducibly.
