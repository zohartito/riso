[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riso"
version = "0.3.0"
description = "Style-locked flat illustration from prompts, geometric motifs, or imported artwork"
requires-python = ">=3.11"
dependencies = ["numpy", "pillow", "requests"]

[project.optional-dependencies]
# only `riso vector --engine trace` needs it; the proof raster also needs the
# resvg binary on PATH (brew install resvg)
vector = ["vtracer"]

[project.scripts]
riso = "riso.cli:main"

[tool.setuptools]
packages = ["riso"]
